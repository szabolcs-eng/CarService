services:
  # 1. Frontend (React + Nginx)
  frontend:
    build:
      context: ../../../Frontend/carservice-frontend
      dockerfile: Dockerfile
    ports:
      - "3000:80"
    depends_on:
      - api

  # 2. Backend API (.NET 10)
  api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      # Secrets are read from a local .env file (gitignored) - never hardcode
      # them here. Copy .env.example to .env and fill in real values.
      - Jwt__Key=${JWT_KEY:?Set JWT_KEY in your .env file - see .env.example}
      - Jwt__Issuer=CarService
      - Jwt__Audience=CarServiceUsers
      - Cors__AllowedOrigins__0=http://localhost:3000
      - ConnectionStrings__DefaultConnection=Data Source=/app/data/carservice.db
    volumes:
      - carservice_storage:/app/data

volumes:
  carservice_storage:
