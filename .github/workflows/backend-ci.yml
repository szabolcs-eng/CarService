name: CarService Backend CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup .NET 10
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x

    - name: Restore dependencies
      run: dotnet restore Backend/CarServiceApi/CarServiceApi.slnx

    - name: Build
      run: dotnet build Backend/CarServiceApi/CarServiceApi.slnx --no-restore --configuration Release

    - name: Test
      run: dotnet test Backend/CarServiceApi/CarServiceApi.slnx --no-build --configuration Release --verbosity normal
